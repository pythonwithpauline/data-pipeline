[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-service"
version = "0.2.0"
description = "Dummy clean service that cleans leads"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyyaml>=6.0", "openpyxl>=3.1"]

[project.scripts]
clean-service = "clean_service.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
