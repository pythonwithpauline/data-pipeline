[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-service"
version = "0.1.0"
description = "Dummy cleaning service for leads"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
clean-service = "clean_service.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
