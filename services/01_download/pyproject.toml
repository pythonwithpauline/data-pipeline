[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "download-service"
version = "0.1.0"
description = "Dummy download service that generates leads"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
download-service = "download_service.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
