[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "download-service"
version = "0.2.0"
description = "Dummy download service that fetches leads via an HTTP adapter"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyyaml>=6.0", "openpyxl>=3.1"]

[project.scripts]
download-service = "download_service.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
